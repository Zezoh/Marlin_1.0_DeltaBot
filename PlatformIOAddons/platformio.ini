# PlatformIO project for the Marlin Delta firmware.
# Build from this directory with: platformio run

[platformio]
src_dir = ../Marlin

[env:mega2560]
platform = atmelavr
framework = arduino
board = megaatmega2560
board_build.f_cpu = 16000000L

[env:mega1280]
platform = atmelavr
framework = arduino
board = megaatmega1280
board_build.f_cpu = 16000000L
